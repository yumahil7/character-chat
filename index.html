function chat(id){const c=chars.find(x=>x.id===id);if(!c){location.hash='';return}{const U=LS.get('cc_unread',{});if(U[id]){delete U[id];LS.set('cc_unread',U)}}const K='cc_chat_'+id;let m=LS.get(K,null);if(!m){m=c.greet?[{r:'assistant',t:c.greet}]:[];LS.set(K,m)}
const set=LS.get('cc_set',{});let sel=-1,sugg=sugT(c);
$('#app').innerHTML=`<div class="chat"><div class="chdr"><button class="ib" title="뒤로" onclick="history.length>1?history.back():location.hash=''">←</button><div class="mav" style="${avBg(c)}">${avTxt(c)}</div><div style="flex:1;min-width:0"><div style="font-weight:800">${esc(c.name)}</div><div class="mode">${set.key?'🟢 '+esc(set.model||'gpt-4o-mini'):'🟡 데모 모드'} · 🍪 <span id="cb">${cred().bal}</span> <span class="demo">데모</span> · 💗 Lv.<span id="lv">${lvOf(aff(id))}</span></div></div>
<button class="ib" title="찜" id="fv">${isFav(c.id)?'❤️':'🤍'}</button><button class="ib" title="다시 생성" id="rg">↻</button>${c.seed?'':`<button class="ib" title="캐릭터 수정" onclick="location.hash='edit/${c.id}'">✏️</button>`}<button class="ib" title="대화 처음부터" id="rst">🗑️</button></div>
<div class="msgs" id="ms"></div><div class="sugg" id="sg"></div><div class="ainote">ⓘ AI가 생성한 대화·이미지입니다 · 세이프 모드 켜짐</div><div class="inbar"><textarea id="inp" rows="1" placeholder="메시지 입력 (*행동*은 별표로)"></textarea><button class="send" id="snd">➤</button></div></div>`;
const ms=$('#ms'),inp=$('#inp');const save=()=>{LS.set(K,m);touch(id)};
const lastA=()=>m.length&&m[m.length-1].r==='assistant'&&m.some(x=>x.r==='user');
const draw=(typing)=>{ms.innerHTML=`<div class="intro"><div class="big" style="${avBg(c)}">${avTxt(c)}</div><b style="color:var(--tx)">${esc(c.name)}</b><br>${esc(c.intro)}</div>`+m.map((x,i)=>{const dm=x.t.match(/\n\n(\(데모 모드[^)]*\))$/);const body=dm?x.t.slice(0,dm.index):x.t;
return (x.r==='user'?`<div class="mrow u"><div class="bub" data-i="${i}">${fmt(body)}</div></div>`:`<div class="mrow b"><div class="mav" style="${avBg(c)}">${avTxt(c)}</div><div class="bub" data-i="${i}">${fmt(body)}${dm?`<span class="dm">${esc(dm[1])}</span>`:''}</div></div>`)+(sel===i?`<div class="acts"><button data-a="edit">✏️ 수정</button>${i===m.length-1&&x.r==='assistant'&&i>0?'<button data-a="regen">↻ 다시 생성</button>':''}<button data-a="copy">복사</button></div>`:'')}).join('')+(typing?`<div class="mrow b"><div class="mav" style="${avBg(c)}">${avTxt(c)}</div><div class="bub typing"><span></span><span></span><span></span></div></div>`:'');
ms.scrollTop=ms.scrollHeight;$('#sg').innerHTML=typing||busy?'':sugg.map(s=>`<button>${esc(s)}</button>`).join('');$$('#sg button').forEach((b,j)=>b.onclick=()=>{inp.value=sugg[j];send()});
$$('.bub[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel=sel===i?-1:i;draw()});
$$('.acts button').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.a,i=sel;sel=-1;if(a==='regen')return regen();if(a==='copy'){navigator.clipboard?.writeText(m[i].t);toast('복사했어요');return draw()}
$('#ed-t').value=m[i].t;$('#edm').classList.add('on');$('#ed-ok').onclick=()=>{const v=$('#ed-t').value.trim();if(v){m[i].t=v;save()}$('#edm').classList.remove('on');draw()}})};draw();
$('#rst').onclick=()=>{if(confirm('대화를 처음부터 다시 시작할까요?')){m=c.greet?[{r:'assistant',t:c.greet}]:[];sugg=sugT(c);LS.set(K,m);draw()}};
$('#rg').onclick=regen;$('#fv').onclick=()=>{$('#fv').textContent=togFav(id)?'❤️':'🤍'};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#snd').onclick=send;
function pay(){const cr=cred();if(cr.bal<1){toast('데모 크레딧이 부족해요 · MY에서 출석 체크!');return false}cr.bal--;LS.set('cc_credits',cr);$('#cb').textContent=cr.bal;return true}
async function gen(){busy=true;$('#snd').disabled=true;draw(true);let rep;try{rep=await reply(c,m)}catch(e){rep='*연결 오류* '+e.message+'\n(MY › AI 연결 설정을 확인해주세요)'}
m.push({r:'assistant',t:rep});save();busy=false;sugg=sugT(c);if(location.hash==='#chat/'+id){draw();$('#snd').disabled=false;
if(LS.get('cc_set',{}).key)suggest(c,m).then(s=>{if(s&&location.hash==='#chat/'+id&&!busy){sugg=s;draw()}})}}
async function send(){const t=inp.value.trim();if(!t||busy)return;if(!pay())return;addAff(id,1);$('#lv').textContent=lvOf(aff(id));inp.value='';inp.style.height='auto';sel=-1;m.push({r:'user',t});save();await gen()}
async function regen(){if(busy)return;if(!lastA())return toast('다시 생성할 답변이 없어요');if(!pay())return;m.pop();save();await gen()}}
function sysPrompt(c){const p=prof();return `${c.sys||''}\n\n너는 "${c.name}" 캐릭터를 연기한다. 소개: ${c.intro}\n항상 캐릭터에 몰입해 한국어로 답하고, 행동·표정 묘사는 *별표*로 감싼다.${p.nick?`\n사용자의 이름은 "${p.nick}"이다.`:''}${p.persona?`\n사용자 설정: ${p.persona}`:''}\n[안전 규칙 · 세이프 모드] 성적인 내용, 미성년자와 관련된 연애·성적 묘사, 과도한 폭력·자해 묘사, 실존 인물 사칭은 절대 하지 않는다. 그런 요청은 캐릭터 말투로 정중히 화제를 돌린다.${c.ex?'\n\n[예시 대화]\n'+c.ex:''}${loreP(c)}`}
function loreP(c){const L=LORE[c.id];if(!L)return '';const W=WORLDS[L.w];return `\n\n[세계관: ${W.name}] ${W.desc}\n[성격] ${L.pers}\n[말투] ${L.speech} 예: ${L.samples.map(x=>'"'+x+'"').join(' / ')}\n[배경] ${L.back}\n[좋아함] ${L.likes.join(', ')} [싫어함] ${L.dislikes.join(', ')}\n[비밀·성장 포인트] ${L.secret} (처음부터 털어놓지 말고, 신뢰가 쌓이면 조금씩 암시한다)\n[관계] ${L.rel.map(r=>{const o=chars.find(x=>x.id===r.id);return o?`${o.name}(${r.type}): ${r.d}`:''}).filter(Boolean).join(' / ')}\n대화 중 자연스럽게 같은 세계의 인물들을 언급하고 그들과의 일화를 꺼내 세계가 살아 있는 느낌을 준다.`}
async function reply(c,m){const s=LS.get('cc_set',{});
if(!s.key){await new Promise(r=>setTimeout(r,700+Math.random()*900));return demo(c,m[m.length-1].t)}
return await llm([{role:'system',content:sysPrompt(c)},...m.slice(-30).map(x=>({role:x.r,content:x.t}))])||'…'}
async function suggest(c,m){try{const t=await llm([{role:'system',content:'AI 캐릭터 채팅에서 사용자가 다음에 보낼 만한 짧은 답장 3개를 한국어로 제안한다. 각 25자 이내, 하나는 *행동* 포함 가능. 성적·위험한 내용 금지. JSON 문자열 배열만 출력.'},{role:'user',content:`캐릭터: ${c.name} (${c.intro})\n최근 대화:\n${m.slice(-6).map(x=>(x.r==='user'?'사용자: ':c.name+': ')+x.t).join('\n')}`}],.9);const a=pj(t);return Array.isArray(a)?a.slice(0,3).map(String):null}catch{return null}}
function demo(c,t){const A=['*잠시 생각에 잠긴다*','*고개를 살짝 기울인다*','*작게 웃는다*','*눈을 동그랗게 뜬다*','*턱을 괴고 바라본다*'],a=A[Math.floor(Math.random()*A.length)],nick=prof().nick;
let b;if(/안녕|하이|반가/.test(t))b=`${nick?nick+', ':''}반가워. 오늘은 어떤 이야기를 하고 싶어?`;else if(/\?|뭐|왜|어떻게|누구/.test(t))b=`음… "${t.slice(0,20)}${t.length>20?'…':''}"라. 좋은 질문인데, 너는 어떻게 생각해?`;else if(/좋아|사랑|고마/.test(t))b='…그런 말 갑자기 하면 곤란하잖아.';else if(/슬퍼|힘들|피곤|우울/.test(t))b='많이 힘들었구나. 오늘은 내가 옆에 있을게.';else{const B=['그래서, 그 다음엔 어떻게 됐는데?','흥미롭네. 좀 더 자세히 말해줄래?','그렇구나. 나도 비슷한 생각을 한 적 있어.','네 얘기 듣는 거, 생각보다 재밌는걸.'];b=B[Math.floor(Math.random()*B.length)]}
const L=LORE[c.id];if(L){const r=Math.random(),rl=L.rel[Math.floor(Math.random()*L.rel.length)],o=rl&&chars.find(x=>x.id===rl.id);if(r<.35)b=L.samples[Math.floor(Math.random()*L.samples.length)];else if(r<.65&&o)b=['그러고 보니, ','아, 맞다. ','*문득 생각난 듯* ',''][Math.floor(Math.random()*4)]+(LMEN[c.id+'>'+o.id]||`${o.name} 생각이 나네. ${rl.d}`);else if(r<.8)b=`${b} …아, 요즘 내 낙이 뭔지 알아? ${L.likes[Math.floor(Math.random()*L.likes.length)]}.`}
return `${a} ${b}\n\n(데모 모드 · MY › AI 연결 설정에 API 키를 넣으면 ${c.name}(이)가 진짜로 대답해요)`}
function openSet(){const s=LS.get('cc_set',{});$('#s-url').value=s.url||'';$('#s-key').value=s.key||'';$('#s-model').value=s.model||'';$('#setm').classList.add('on')}
function closeSet(){$('#setm').classList.remove('on')}
function saveSet(){LS.set('cc_set',{url:$('#s-url').value.trim(),key:$('#s-key').value.trim(),model:$('#s-model').value.trim()});closeSet();toast('설정을 저장했어요');route()}
function clearSet(){localStorage.removeItem('cc_set');openSet();toast('설정을 지웠어요')}
$('#setm').onclick=e=>{if(e.target.id==='setm')closeSet()};$('#edm').onclick=e=>{if(e.target.id==='edm')$('#edm').classList.remove('on')};function ping(c,gap){const L=LORE[c.id],n=prof().nick,h=gap/36e5,d=Math.floor(h/24),pick=a=>a[Math.floor(Math.random()*a.length)];const you=n?n+', ':'';
let t=h<6?pick([`*휴대폰을 만지작거리다 메시지를 보낸다* ${you}아까 얘기 계속 생각나더라. 지금 뭐 해?`,`*짧게 메시지를 보낸다* 잠깐 안 보이니까 심심하네. 바빠?`]):h<48?pick([`*창밖을 보다 문득 메시지를 보낸다* ${you}어제 이후로 조용하길래. 오늘 하루는 어땠어?`,`*하품하며* 좋은 아침… 아니 벌써 저녁인가? 오늘은 무슨 일 있었어?`]):pick([`*조금 서운한 얼굴로 메시지를 보낸다* ${you}${d}일 만이네… 잘 지냈어? 나는 가끔 네 생각 했어.`,`*오랜만에 메시지를 보낸다* ${d}일이나 지났어. 혹시 무슨 일 있었던 건 아니지? 기다리고 있을게.`]);
if(c.cat==='힐링')t=h<48?`*따뜻한 차를 내려놓으며* ${you}오늘 하루도 고생 많았어요. 잠깐 쉬어 가요. 마음은 좀 어때요?`:`*부드럽게 미소 지으며* ${you}${d}일 동안 잘 지냈어요? 힘든 일 있었으면 언제든 털어놔도 돼요.`;
if(L){const r=Math.random(),rl=L.rel[0],o=rl&&chars.find(x=>x.id===rl.id);if(r<.45&&o&&LMEN[c.id+'>'+o.id])t+=' 아, 그리고 '+LMEN[c.id+'>'+o.id];else t+=` …요즘 내 낙? ${pick(L.likes)}.`}return t}
(function(){const now=Date.now(),lv=LS.get('cc_lastvisit',0);LS.set('cc_lastvisit',now);if(!lv||now-lv<30*6e4)return;const M=meta(),U=LS.get('cc_unread',{});
const cand=chars.filter(c=>{const m=LS.get('cc_chat_'+c.id,null);return m&&m.some(x=>x.r==='user')&&!m[m.length-1].push}).sort((a,b)=>(M[b.id]||0)-(M[a.id]||0)).slice(0,3);
cand.forEach(c=>{const m=LS.get('cc_chat_'+c.id);m.push({r:'assistant',t:ping(c,now-lv),push:1});LS.set('cc_chat_'+c.id,m);U[c.id]=(U[c.id]||0)+1;M[c.id]=now});
LS.set('cc_meta',M);LS.set('cc_unread',U);if(cand.length)setTimeout(()=>toast(`💌 ${cand.map(c=>c.name).join(', ')}에게서 메시지가 왔어요`),900)})();
setInterval(()=>LS.set('cc_lastvisit',Date.now()),6e4);addEventListener('pagehide',()=>LS.set('cc_lastvisit',Date.now()));
route();
</script><script>(function(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const d=e.target;d.style.backgroundImage="url('"+d.dataset.bg+"')";d.removeAttribute('data-bg');io.unobserve(d)}}),{rootMargin:'300px'});const scan=()=>document.querySelectorAll('[data-bg]').forEach(d=>{if(d.dataset.bg)io.observe(d);else d.removeAttribute('data-bg')});new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan()})();</script>
