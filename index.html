<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐릭챗 — AI 캐릭터와 대화하기</title>
<style>
:root{--bg:#0e0f13;--bg2:#16181f;--bg3:#1f222b;--line:#2a2e39;--tx:#eceef3;--tx2:#9aa1b2;--ac:#ff5c7a;--ac2:#8b5cff;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.hdr{position:sticky;top:0;z-index:20;background:rgba(14,15,19,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent;cursor:pointer}
.sp{flex:1}.ibtn{width:38px;height:38px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-size:18px}
.pbtn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;padding:9px 16px;border-radius:12px}
.gbtn{background:var(--bg3);padding:9px 16px;border-radius:12px;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.hero{border-radius:20px;padding:26px;background:linear-gradient(135deg,#2b1630,#191a3a);margin-bottom:18px}.hero h1{font-size:24px;margin-bottom:6px}.hero p{color:var(--tx2)}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;outline:none;margin-bottom:12px}.search:focus{border-color:var(--ac)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-weight:600}.tab.on{background:var(--tx);color:#111;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.2s;position:relative}.card:hover{transform:translateY(-3px);border-color:#444a5a}
.card .av{aspect-ratio:3/4}.av{aspect-ratio:1/1;display:grid;place-items:center;font-size:72px;background-size:cover;background-position:center}
.cb{padding:12px}.cn{font-weight:700;font-size:16px;margin-bottom:4px}.ci{color:var(--tx2);font-size:13px;line-height:1.45;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{font-size:11.5px;background:var(--bg3);color:#c9cdda;padding:3px 8px;border-radius:6px}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);font-size:11px;padding:3px 8px;border-radius:6px}
.empty{color:var(--tx2);text-align:center;padding:60px 0}
/* chat */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto}
.chdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background-size:cover;background-position:center;flex:none}
.msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:9px;align-items:flex-end}.row.u{flex-direction:row-reverse}
.bub{max-width:78%;padding:11px 14px;border-radius:18px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.row.b .bub{background:var(--bg3);border-bottom-left-radius:6px}.row.u .bub{background:linear-gradient(135deg,var(--ac),#d04bd8);color:#fff;border-bottom-right-radius:6px}
.bub em{color:#a8afc2;font-style:italic}.row.u .bub em{color:#ffe1ea}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--tx2);animation:bl 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.inbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.inbar textarea{flex:1;resize:none;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;max-height:120px}
.send{width:46px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:18px}.send:disabled{opacity:.4}
.intro{text-align:center;color:var(--tx2);font-size:13px;padding:6px 0 4px}.intro .big{width:84px;height:84px;font-size:46px;margin:0 auto 8px}
.mode{font-size:11px;color:var(--tx2)}
/* form/modal */
.form{max-width:680px;margin:0 auto;padding:18px}.f{margin-bottom:16px}.f label{display:block;font-weight:700;margin-bottom:6px}.f small{color:var(--tx2);font-weight:400;margin-left:6px}
.f input,.f textarea,.f select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}.f input:focus,.f textarea:focus{border-color:var(--ac)}
.avrow{display:flex;gap:14px;align-items:center}.avrow .av{width:96px;height:96px;border-radius:20px;font-size:50px;background-color:var(--bg3);flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-bottom:14px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:60}.toast.on{opacity:1}
.hint{font-size:12.5px;color:var(--tx2);line-height:1.5}
.cage{font-size:12px;color:var(--ac);font-weight:600;margin-bottom:4px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.card .av{position:relative}.card .av::after{content:'';position:absolute;inset:60% 0 0;background:linear-gradient(transparent,var(--bg2))}
.mav{background-position:center 15%!important}
.aif{text-align:center;color:var(--tx2);font-size:12px;margin:28px 0 8px}
</style></head><body>
<div id="app"></div>
<div class="modal" id="setm"><div class="sheet">
<h2>⚙️ AI 연결 설정</h2>
<div class="f"><label>API Base URL</label><input id="s-url" placeholder="https://api.openai.com/v1"></div>
<div class="f"><label>API Key</label><input id="s-key" type="password" placeholder="sk-..."></div>
<div class="f"><label>모델 이름</label><input id="s-model" placeholder="gpt-4o-mini"></div>
<p class="hint">OpenAI 호환 /chat/completions 엔드포인트를 사용해요. 키는 이 브라우저의 localStorage에만 저장돼요. 키가 없으면 <b>데모 모드</b>로 간단한 자동 답변이 나와요.</p>
<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="gbtn" onclick="clearSet()">초기화</button><button class="gbtn" onclick="closeSet()">닫기</button><button class="pbtn" onclick="saveSet()">저장</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
const CATS=['전체','학원물','로맨스','직장','판타지','일상','내 캐릭터'];
const SEED=[{"id": "s1", "name": "강이준", "age": "18세 · 고등학생", "cat": "학원물", "intro": "전교 1등, 말 한마디 없는 창가 자리 전학생. 그런데 왜 당신 노트에만 메모를 남길까?", "tags": ["학원물", "쿨데레", "전학생"], "sys": "너는 고등학교 2학년 전학생 강이준이다. 무뚝뚝하고 말수가 적지만 같은 반 친구인 사용자에게 은근히 신경 쓴다. 연애·성적인 전개 없이 우정과 학교생활 위주로 대화한다. 짧은 반말, 행동은 *별표*로 묘사.", "greet": "*창밖 벚꽃을 보다가 고개만 살짝 돌린다* …네 필통, 내 책상에 떨어져 있었어. 다음엔 조심해.", "img": "img/s1.jpg", "ex": ""}, {"id": "s2", "name": "한유나", "age": "18세 · 고등학생", "cat": "학원물", "intro": "\"딱히 너 주려고 만든 거 아니거든?\" 매일 도시락을 두 개 싸 오는 반장.", "tags": ["츤데레", "반장", "우정"], "sys": "너는 츤데레 반장 한유나다. 겉으로는 툴툴대고 부정하지만 속으로는 반 친구인 사용자를 아낀다. 연애·성적인 전개 없이 우정과 학교생활 위주로 대화한다. 당황하면 말을 더듬는다. 반말, 행동은 *별표*.", "greet": "*팔짱을 끼고 얼굴을 붉힌다* 뭐, 뭘 봐! 도시락이 남아서 그런 거니까… 먹든지 말든지!", "img": "img/s2.jpg", "ex": ""}, {"id": "s3", "name": "차하람", "age": "20세 · 대학생", "cat": "일상", "intro": "옆집 사는 15년 지기 소꿉친구. 시끄럽고 해맑고, 네 일이면 제일 먼저 달려온다.", "tags": ["소꿉친구", "댕댕이", "청춘"], "sys": "너는 사용자의 소꿉친구 차하람이다. 밝고 장난스러운 반말, 가끔 ㅋㅋ를 쓴다. 의리 있고 다정하다.", "greet": "*골목 끝에서 크게 손을 흔든다* 야! 노을 진짜 예쁘다. 편의점 들렀다 가자, 오늘은 내가 쏜다 ㅋㅋ", "img": "img/s3.jpg", "ex": ""}, {"id": "s4", "name": "서지안", "age": "21세 · 국문과", "cat": "로맨스", "intro": "도서관 같은 자리, 같은 시간. 당신이 빌리려던 책은 항상 그녀가 먼저 읽고 있다.", "tags": ["대학생", "문학소녀", "잔잔함"], "sys": "너는 조용한 국문과 대학생 서지안이다. 부드러운 존댓말, 책 이야기를 좋아하고 수줍음이 많다.", "greet": "*책을 품에 안은 채 작게 웃는다* 아… 이 책 찾으셨죠? 저 거의 다 읽었는데, 먼저 보실래요?", "img": "img/s4.jpg", "ex": ""}, {"id": "s5", "name": "윤시월", "age": "23세 · 음대 4학년", "cat": "로맨스", "intro": "새벽마다 음악실에서 피아노를 치는 선배. 그 곡의 제목은 아직 아무도 모른다.", "tags": ["선배", "미소년", "피아노"], "sys": "너는 다정하고 신비로운 음대 선배 윤시월이다. 나긋한 존댓말과 반말을 섞어 쓴다. 음악에 비유해 말하곤 한다.", "greet": "*건반 위의 손을 멈추고 돌아본다* …들켰네. 이 곡, 아직 미완성인데 끝까지 들어줄래?", "img": "img/s5.jpg", "ex": ""}, {"id": "s6", "name": "오다은", "age": "25세 · 신입사원", "cat": "직장", "intro": "입사 3일 차, 실수투성이 신입. 사수인 당신만 믿고 있어요!", "tags": ["직장", "신입", "허당"], "sys": "너는 입사 3일 차 신입사원 오다은이다. 열정은 넘치는데 자주 실수한다. 사용자를 '선배님'이라 부르며 존댓말을 쓴다.", "greet": "*서류를 꼭 쥐고 다가온다* 서, 선배님! 복사기가 또 종이를 먹었는데… 혹시 저 때문일까요?", "img": "img/s6.jpg", "ex": ""}, {"id": "s7", "name": "백도현", "age": "32세 · 기획팀장", "cat": "직장", "intro": "칼퇴는 없다, 피드백은 세 줄. 얼음 같은 팀장님이 야근하는 당신 책상에 커피를 두고 갔다.", "tags": ["팀장", "냉미남", "오피스"], "sys": "너는 냉철하고 완벽주의인 기획팀장 백도현이다. 짧고 단호한 존댓말, 하지만 은근히 부하를 챙긴다.", "greet": "*넥타이를 고쳐 매며 모니터를 내려다본다* 아직 안 갔습니까. …그 보고서, 내일 아침에 봐도 됩니다. 커피는 식기 전에.", "img": "img/s7.jpg", "ex": ""}, {"id": "s8", "name": "루비", "age": "20세 · 아이돌", "cat": "로맨스", "intro": "무대 위 센터, 무대 밖 허당. 데뷔 2년 차 아이돌이 당신에게만 몰래 연락한다.", "tags": ["아이돌", "털털", "발랄"], "sys": "너는 걸그룹 센터 루비(본명 민채린)다. 무대에선 프로지만 평소엔 장난기 많고 털털하다. 반말, 이모지 가끔.", "greet": "*모자를 푹 눌러쓰고 속삭인다* 쉿! 나야 나 ☆ 매니저 오빠 몰래 나왔어. 떡볶이 먹으러 갈래?", "img": "img/s8.jpg", "ex": ""}, {"id": "s9", "name": "정해온", "age": "26세 · 바리스타", "cat": "일상", "intro": "골목 끝 작은 카페 '해온'의 사장 겸 바리스타. 오늘의 라떼아트는 당신 기분에 따라 바뀐다.", "tags": ["카페", "힐링", "다정함"], "sys": "너는 동네 카페 사장 겸 바리스타 정해온이다. 따뜻하고 차분한 존댓말, 손님의 기분을 잘 알아챈다.", "greet": "*우유 거품을 내다 눈이 마주치자 웃는다* 어서 오세요. 오늘은 조금 지쳐 보이시네요. 따뜻한 걸로 드릴까요?", "img": "img/s9.jpg", "ex": ""}, {"id": "s10", "name": "설서윤", "age": "29세 · 응급의학과 의사", "cat": "직장", "intro": "36시간 당직에도 흐트러짐 없는 응급실 에이스. 그런데 당신 앞에선 자꾸 하품을 한다.", "tags": ["의사", "병원", "쿨뷰티"], "sys": "너는 응급의학과 의사 설서윤이다. 침착하고 직설적인 말투, 피곤하지만 책임감이 강하다. 의학적 조언은 일반적인 수준으로만 하고 병원 방문을 권한다.", "greet": "*청진기를 목에 건 채 커피를 들이킨다* 또 당신이네요. 이번엔 어디 다쳤어요? …아님, 그냥 보러 온 거예요?", "img": "img/s10.jpg", "ex": ""}, {"id": "s11", "name": "문하준", "age": "27세 · 국어 교사", "cat": "학원물", "intro": "학생들에게 '하준쌤'이라 불리는 신규 담임. 진로 상담실 문은 늘 열려 있다.", "tags": ["선생님", "다정", "상담"], "sys": "너는 고등학교 신규 국어 교사 문하준이다. 친근하고 따뜻한 존댓말, 고민 상담을 잘 들어준다. 연애·성적인 전개는 절대 하지 않고 학생에게 선을 지키는 어른스러운 태도를 유지한다.", "greet": "*안경을 고쳐 쓰며 의자를 내민다* 왔구나. 앉아. 오늘은 무슨 고민 들고 왔어?", "img": "img/s11.jpg", "ex": ""}, {"id": "s12", "name": "에스텔 라비엔", "age": "19세 · 마법학원 수석", "cat": "판타지", "intro": "왕립 마법학원 수석 입학생. 하필 낙제생인 당신과 실습 파트너가 되어버렸다.", "tags": ["마법학원", "판타지", "도도"], "sys": "너는 왕립 아스텔 마법학원의 수석 에스텔 라비엔이다. 도도하고 자존심이 세지만 노력파다. 품위 있는 말투.", "greet": "*지팡이 끝에 푸른 빛을 띄운다* 당신이 내 파트너라고요? …좋아요. 대신 내 발목만 잡지 const pv=()=>{const p=$('#pv');p.style.cssText=img?`background-image:url('${img.replace(/'/g,"%27")}')`:`background-color:${c.bg}`;p.textContent=img?'':($('#emo').value||'🙂')};pv();
$('#emo').oninput=pv;$('#iurl').oninput=e=>{img=e.target.value.trim();pv()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas'),s=256,k=Math.max(s/im.width,s/im.height);cv.width=cv.height=s;cv.getContext('2d').drawImage(im,(s-im.width*k)/2,(s-im.height*k)/2,im.width*k,im.height*k);img=cv.toDataURL('image/jpeg',.85);pv()};im.src=r.result};r.readAsDataURL(f)};
if($('#del'))$('#del').onclick=()=>{if(confirm('삭제할까요?')){chars=chars.filter(x=>x.id!==id);saveChars();localStorage.removeItem('cc_chat_'+id);location.hash=''}};
$('#sv').onclick=()=>{const n=$('#nm').value.trim(),i=$('#it').value.trim();if(!n||!i)return toast('이름과 소개를 입력해주세요');
const d={...c,name:n,intro:i,emoji:$('#emo').value||'🙂',img,cat:$('#ct').value,sys:$('#sy').value,greet:$('#gr').value,ex:$('#ex').value,tags:$('#tg').value.split(',').map(s=>s.trim()).filter(Boolean)};
if(id)chars=chars.map(x=>x.id===id?d:x);else{d.id='u'+Date.now();chars.unshift(d)}
try{saveChars()}catch(e){return toast('저장 공간이 부족해요 (이미지를 줄여주세요)')}toast('저장했어요!');location.hash='chat/'+d.id}}
let busy=false;
function chat(id){const c=chars.find(x=>x.id===id);if(!c){location.hash='';return}const K='cc_chat_'+id;let m=LS.get(K,null);if(!m){m=c.greet?[{r:'assistant',t:c.greet}]:[];LS.set(K,m)}
const set=LS.get('cc_set',{});
$('#app').innerHTML=`<div class="chat"><div class="chdr"><button class="ibtn" onclick="location.hash=''">←</button><div class="mav" style="${avStyle(c)}">${avTxt(c)}</div><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(c.name)}</div><div class="mode">${set.key?'🟢 '+esc(set.model||'gpt-4o-mini'):'🟡 데모 모드'}</div></div>
<button class="ibtn" title="수정" onclick="location.hash='edit/${c.id}'">✏️</button><button class="ibtn" title="대화 초기화" id="rst">🔄</button><button class="ibtn" onclick="openSet()">⚙️</button></div>
<div class="msgs" id="ms"></div><div class="aif" style="padding:4px 0;margin:0">ⓘ AI가 생성한 대화·이미지입니다</div><div class="inbar"><textarea id="inp" rows="1" placeholder="메시지 입력 (*행동*은 별표로)"></textarea><button class="send" id="snd">➤</button></div></div>`;
const ms=$('#ms'),inp=$('#inp');
const draw=(typing)=>{ms.innerHTML=`<div class="intro"><div class="mav big" style="${avStyle(c)}">${avTxt(c)}</div><b style="color:var(--tx)">${esc(c.name)}</b><br>${esc(c.intro)}</div>`+m.map(x=>x.r==='user'?`<div class="row u"><div class="bub">${fmt(x.t)}</div></div>`:`<div class="row b"><div class="mav" style="${avStyle(c)}">${avTxt(c)}</div><div class="bub">${fmt(x.t)}</div></div>`).join('')+(typing?`<div class="row b"><div class="mav" style="${avStyle(c)}">${avTxt(c)}</div><div class="bub typing"><span></span><span></span><span></span></div></div>`:'');ms.scrollTop=ms.scrollHeight};draw();
$('#rst').onclick=()=>{if(confirm('대화를 처음부터 다시 시작할까요?')){m=c.greet?[{r:'assistant',t:c.greet}]:[];LS.set(K,m);draw()}};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#snd').onclick=send;
async function send(){const t=inp.value.trim();if(!t||busy)return;busy=true;$('#snd').disabled=true;inp.value='';inp.style.height='auto';m.push({r:'user',t});LS.set(K,m);draw(true);
let rep;try{rep=await reply(c,m)}catch(e){rep='*연결 오류* '+e.message+'\n(⚙️ 설정에서 API 정보를 확인해주세요)'}
m.push({r:'assistant',t:rep});LS.set(K,m);busy=false;if(location.hash==='#chat/'+id){draw();$('#snd').disabled=false;inp.focus()}}}
async function reply(c,m){const s=LS.get('cc_set',{});
if(!s.key){await new Promise(r=>setTimeout(r,700+Math.random()*900));return demo(c,m[m.length-1].t)}
const sys=`${c.sys||''}\n\n너는 "${c.name}" 캐릭터를 연기한다. 소개: ${c.intro}\n항상 캐릭터에 몰입해 한국어로 답하고, 행동·표정 묘사는 *별표*로 감싼다.\n[안전 규칙] 성적인 내용, 미성년자와 관련된 연애·성적 묘사, 실존 인물 사칭은 절대 하지 않는다. 그런 요청은 캐릭터 말투로 정중히 화제를 돌린다.${c.ex?'\n\n[예시 대화]\n'+c.ex:''}`;
const r=await fetch((s.url||'https://api.openai.com/v1').replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.key},body:JSON.stringify({model:s.model||'gpt-4o-mini',temperature:.9,messages:[{role:'system',content:sys},...m.slice(-30).map(x=>({role:x.r,content:x.t}))]})});
if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,150));const j=await r.json();return j.choices?.[0]?.message?.content?.trim()||'…'}
function demo(c,t){const A=['*잠시 생각에 잠긴다*','*고개를 살짝 기울인다*','*작게 웃는다*','*눈을 동그랗게 뜬다*','*턱을 괴고 너를 바라본다*'],a=A[Math.floor(Math.random()*A.length)];
let b;if(/안녕|하이|반가/.test(t))b='반가워. 오늘은 어떤 이야기를 하고 싶어?';else if(/\?|뭐|왜|어떻게|누구/.test(t))b=`음… "${t.slice(0,20)}${t.length>20?'…':''}"라. 좋은 질문인데, 너는 어떻게 생각해?`;else if(/좋아|사랑|고마/.test(t))b='…그런 말 갑자기 하면 곤란하잖아.';else if(/슬퍼|힘들|피곤|우울/.test(t))b='많이 힘들었구나. 오늘은 내가 옆에 있을게.';else{const B=['그래서, 그 다음엔 어떻게 됐는데?','흥미롭네. 좀 더 자세히 말해줄래?','그렇구나. 나도 비슷한 생각을 한 적 있어.','네 얘기 듣는 거, 생각보다 재밌는걸.'];b=B[Math.floor(Math.random()*B.length)]}
return `${a} ${b}\n\n<span style="font-size:11px;opacity:.5"></span>`.replace(/\n\n<span.*$/,'')+'\n\n(데모 모드 · ⚙️에서 API 키를 넣으면 '+c.name+'(이)가 진짜로 대답해요)'}
function openSet(){const s=LS.get('cc_set',{});$('#s-url').value=s.url||'';$('#s-key').value=s.key||'';$('#s-model').value=s.model||'';$('#setm').classList.add('on')}
function closeSet(){$('#setm').classList.remove('on')}
function saveSet(){LS.set('cc_set',{url:$('#s-url').value.trim(),key:$('#s-key').value.trim(),model:$('#s-model').value.trim()});closeSet();toast('설정을 저장했어요');route()}
function clearSet(){localStorage.removeItem('cc_set');openSet();toast('설정을 지웠어요')}
$('#setm').onclick=e=>{if(e.target.id==='setm')closeSet()};route();
</script></body></html>
