<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13"><title>캐릭챗 — AI 캐릭터와 대화하기</title>
<style>
:root{--bg:#0e0f13;--bg2:#171920;--bg3:#22252e;--line:#2a2e39;--tx:#eceef3;--tx2:#9aa1b2;--ac:#ff5c7a;--ac2:#8b5cff;--W:480px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#050507}body{background:#050507;color:var(--tx);font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#app{max-width:var(--W);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:76px;box-shadow:0 0 0 1px #1a1c22,0 0 60px rgba(139,92,255,.08)}
#app.full{padding-bottom:0}
.top{position:sticky;top:0;z-index:20;background:rgba(14,15,19,.92);backdrop-filter:blur(12px);display:flex;align-items:center;gap:6px;padding:12px 14px}
.logo{font-weight:900;font-size:21px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.ttl{font-weight:800;font-size:19px}.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;position:relative}.ib:active{background:var(--bg3)}
.dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.pbtn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;padding:11px 16px;border-radius:12px}.pbtn:disabled{opacity:.5}
.gbtn{background:var(--bg3);padding:11px 16px;border-radius:12px;font-weight:600}
.pad{padding:0 14px}
/* banner */
.bnw{position:relative;margin:4px 14px 14px}.bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}.bn::-webkit-scrollbar{display:none}
.bi{flex:0 0 100%;scroll-snap-align:start;height:150px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;cursor:pointer}
.bi b{font-size:19px;line-height:1.3;z-index:1}.bi span{font-size:12.5px;opacity:.85;margin-top:5px;z-index:1}.bi i{position:absolute;right:14px;top:10px;font-size:64px;font-style:normal;opacity:.9}
.bi small{position:absolute;left:16px;top:14px;font-size:11px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px}
.dots{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:.3s}.dots i.on{width:16px;background:#fff}
/* sub tabs, chips */
.st{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}.st button{padding:10px 0;font-weight:800;font-size:16px;color:var(--tx2);border-bottom:2px solid transparent}.st button.on{color:var(--tx);border-color:var(--tx)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-weight:600;font-size:13.5px}.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.lbl{font-size:12px;color:var(--tx2);padding:2px 14px 6px;font-weight:700}
.search{display:block;width:calc(100% - 28px);margin:0 14px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;outline:none}.search:focus{border-color:var(--ac)}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:0 14px}
.card{cursor:pointer;min-width:0;position:relative}
.cimg{aspect-ratio:3/4;border-radius:14px;background:var(--bg3) center 20%/cover;position:relative;overflow:hidden;display:grid;place-items:center;font-size:64px}
.cimg::after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cnt{position:absolute;left:8px;bottom:7px;z-index:1;font-size:11.5px;font-weight:700;display:flex;gap:4px;align-items:center}
.demo{font-size:9.5px;background:rgba(255,255,255,.2);padding:1px 5px;border-radius:4px;font-weight:600}
.rk{position:absolute;left:8px;top:6px;z-index:1;font-size:26px;font-weight:900;font-style:italic;text-shadow:0 2px 6px #000}
.mine{position:absolute;right:7px;top:7px;z-index:1;background:var(--ac);font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700}
.cn{font-weight:800;margin:7px 2px 2px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci{color:var(--tx2);font-size:12.5px;line-height:1.4;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:0 2px}
.tags{display:flex;gap:4px;margin:5px 2px 0;overflow:hidden;height:20px;flex-wrap:wrap}.tag{font-size:11px;color:#b9bfcf;background:var(--bg2);padding:2px 6px;border-radius:5px}
.empty{color:var(--tx2);text-align:center;padding:60px 0;grid-column:1/-1}
.aif{text-align:center;color:var(--tx2);font-size:11.5px;padding:24px 18px 10px;line-height:1.5}
/* tabbar */
.tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--W);z-index:30;display:flex;background:rgba(14,15,19,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tb button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2);font-weight:600}.tb button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.65}
.tb button.on{color:var(--tx)}.tb button.on i{filter:none;opacity:1}
.tb .mk i{background:linear-gradient(135deg,var(--ac),var(--ac2));width:34px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:17px;filter:none;opacity:1;color:#fff}
/* list */
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}.li:active{background:var(--bg2)}
.mav{width:46px;height:46px;border-radius:50%;flex:none;background:var(--bg3) center 15%/cover;display:grid;place-items:center;font-size:24px}
.lt{flex:1;min-width:0}.lt b{display:flex;justify-content:space-between;gap:8px}.lt b small{color:var(--tx2);font-weight:400;font-size:11.5px;white-space:nowrap}
.lt p{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* forms */
.form{padding:4px 14px 20px}.f{margin-bottom:14px}.f label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}.f small{color:var(--tx2);font-weight:400;margin-left:6px}
.f input,.f textarea,.f select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}.f input:focus,.f textarea:focus{border-color:var(--ac)}
.avrow{display:flex;gap:12px;align-items:center}.avrow .pv{width:84px;height:112px;border-radius:14px;font-size:44px;background:var(--bg3) center 20%/cover;display:grid;place-items:center;flex:none}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.box h3{font-size:15px;margin-bottom:8px}
.quick{background:linear-gradient(135deg,#2b1630,#191a3a);border:0}.qrow{display:flex;gap:8px}.qrow input{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 13px;outline:none;min-width:0}
.hint{font-size:12.5px;color:var(--tx2);line-height:1.5}
.row2{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sw{width:46px;height:26px;border-radius:13px;background:#3a3e4a;position:relative;flex:none}.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#38c172}.sw.on::after{left:23px}.sw.lock{opacity:.75}
.cred{font-size:28px;font-weight:900}.pill{font-size:11px;background:var(--bg3);color:#ffd36b;padding:3px 8px;border-radius:999px;font-weight:700}
.menu .li{padding:14px 2px;border-bottom:1px solid var(--line)}.menu .li:last-child{border:0}
/* chat */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh}
.chdr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}.chdr .mav{width:36px;height:36px}
.mode{font-size:11px;color:var(--tx2)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.intro{text-align:center;color:var(--tx2);font-size:12.5px;padding:4px 10px}.intro .big{width:96px;height:128px;border-radius:16px;margin:0 auto 8px;background:var(--bg3) center 20%/cover;display:grid;place-items:center;font-size:48px}
.mrow{display:flex;gap:8px;align-items:flex-start}.mrow.u{flex-direction:row-reverse}.mrow .mav{width:34px;height:34px;font-size:18px}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.mrow.b .bub{background:var(--bg3);border-top-left-radius:4px}.mrow.u .bub{background:linear-gradient(135deg,var(--ac),#d04bd8);color:#fff;border-top-right-radius:4px}
.bub em{color:#a3abbf;font-style:italic;display:inline}.mrow.u .bub em{color:#ffe1ea}
.bub .dm{display:block;font-size:11px;opacity:.55;margin-top:6px;font-style:normal}
.acts{display:flex;gap:6px;margin:-4px 0 0 42px}.mrow.u+.acts{justify-content:flex-end;margin:-4px 0 0}.acts button{font-size:12px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--tx2);animation:bl 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}.sugg::-webkit-scrollbar{display:none}.sugg button{white-space:nowrap;font-size:13px;background:var(--bg2);border:1px solid #3b3550;color:#d9ccff;padding:6px 12px;border-radius:999px}
.ainote{text-align:center;color:var(--tx2);font-size:11px;padding:4px 0 0}
.inbar{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.inbar textarea{flex:1;resize:none;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;outline:none;max-height:120px}
.send{width:44px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:18px}.send:disabled{opacity:.4}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:var(--W);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin-bottom:14px;font-size:18px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:60;white-space:nowrap;font-size:14px}.toast.on{opacity:1}
body.light{background:#e9ebf0}body.light{--bg:#ffffff;--bg2:#f3f4f7;--bg3:#e6e8ee;--line:#dde0e7;--tx:#16181d;--tx2:#5d6474}body.light .tag{color:#4a5060}
.dt{padding:0 0 90px}.dhero{height:340px;background:center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;font-size:90px}.dhero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--bg))}
.dhero .ib{position:absolute;top:10px;z-index:2;background:rgba(0,0,0,.45);color:#fff}.dbody{padding:0 16px;margin-top:-30px;position:relative;z-index:1}.dbody h2{font-size:24px;margin:0}.dsub{color:var(--tx2);font-size:13px;margin:4px 0 10px}
.dsec{color:var(--tx2);font-size:12px;font-weight:700;margin:16px 0 6px}.gbub{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.6;white-space:pre-wrap}.gbub em{color:var(--tx2)}
.dbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--W);display:flex;gap:8px;padding:10px 16px 16px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}.dbar .pbtn{flex:1}
.fav{font-size:20px;min-width:52px}.fav.on{color:var(--ac)}.hrt{position:absolute;top:6px;left:6px;font-size:14px;text-shadow:0 1px 3px #000}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:300px;overflow:auto;margin-top:8px}.pick div{aspect-ratio:3/4;background:center/cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.pick div:hover{border-color:var(--ac)}
.myrow{display:flex;gap:10px;overflow-x:auto;padding:0 16px 6px}.myrow .card{flex:0 0 31%}.mkc{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx2);font-size:13px;gap:4px}.mkc i{font-size:28px;font-style:normal}
.hero{position:relative;height:min(118vw,520px);overflow:hidden;margin:0 0 14px;touch-action:pan-y;user-select:none;cursor:pointer;background:#000}
.hs{position:absolute;inset:0;opacity:0;transition:opacity .9s ease,transform .9s ease;transform:translateX(var(--dx,0)) scale(1.02);pointer-events:none}.hs.on{opacity:1;pointer-events:auto}
.hs .hp{position:absolute;inset:0;background:center 18%/cover no-repeat}.hs.on .hp{animation:kb 7s ease-out forwards}@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hs:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,20,.35) 0,transparent 22%,transparent 45%,rgba(14,10,30,.65) 70%,rgba(8,6,16,.95))}
.hc{position:absolute;left:18px;right:18px;bottom:40px;z-index:2;color:#fff;transform:translateY(14px);opacity:0;transition:.7s .25s}.hs.on .hc{transform:none;opacity:1}
.hc .hk{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--ac2));margin-bottom:8px}
.hc h2{margin:0;font-size:30px;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.5)}.hc .ha{font-size:12px;opacity:.8;margin:2px 0 6px}.hc p{margin:0 0 8px;font-size:14px;line-height:1.45;opacity:.95}
.hc .ht{display:flex;gap:5px;flex-wrap:wrap}.hc .ht span{font-size:11px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:3px 8px;border-radius:6px}
.hd{position:absolute;bottom:16px;left:18px;right:18px;z-index:3;display:flex;gap:5px}.hd i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;cursor:pointer}.hd i b{display:block;height:100%;width:0;background:#fff}.hd i.on b{animation:hb 3.8s linear forwards}.hd i.dn b{width:100%}@keyframes hb{to{width:100%}}
.htop{position:absolute;top:0;left:0;right:0;z-index:4;background:linear-gradient(rgba(0,0,0,.45),transparent)}.htop .logo,.htop .ib{color:#fff}
</style></head><body>
<div id="app"></div><div id="tbar"></div>
<div class="modal" id="setm"><div class="sheet">
<h2>⚙️ AI 연결 설정</h2>
<div class="f"><label>API Base URL</label><input id="s-url" placeholder="https://api.openai.com/v1"></div>
<div class="f"><label>API Key</label><input id="s-key" type="password" placeholder="sk-..."></div>
<div class="f"><label>모델 이름</label><input id="s-model" placeholder="gpt-4o-mini"></div>
<p class="hint">OpenAI 호환 /chat/completions 주소를 써요 (OpenRouter, Gemini, Groq 등). 키는 이 브라우저의 localStorage에만 저장돼요. 키가 없으면 <b>데모 모드</b>로 미리 넣어둔 답변이 나와요.</p>
<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="gbtn" onclick="clearSet()">초기화</button><button class="gbtn" onclick="closeSet()">닫기</button><button class="pbtn" onclick="saveSet()">저장</button></div>
</div></div>
<div class="modal" id="edm"><div class="sheet"><h2>✏️ 메시지 수정</h2><div class="f"><textarea id="ed-t" rows="5"></textarea></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="gbtn" onclick="$('#edm').classList.remove('on')">취소</button><button class="pbtn" id="ed-ok">저장</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function openSet(){const s=LS.get('cc_set',{});$('#s-url').value=s.url||'';$('#s-key').value=s.key||'';$('#s-model').value=s.model||'';$('#setm').classList.add('on')}
function closeSet(){$('#setm').classList.remove('on')}
function saveSet(){LS.set('cc_set',{url:$('#s-url').value.trim(),key:$('#s-key').value.trim(),model:$('#s-model').value.trim()});closeSet();toast('설정을 저장했어요');route()}
function clearSet(){localStorage.removeItem('cc_set');openSet();toast('설정을 지웠어요')}
$('#setm').onclick=e=>{if(e.target.id==='setm')closeSet()};$('#edm').onclick=e=>{if(e.target.id==='edm')$('#edm').classList.remove('on')};route();
</script><script>(function(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const d=e.target;d.style.backgroundImage="url('"+d.dataset.bg+"')";d.removeAttribute('data-bg');io.unobserve(d)}}),{rootMargin:'300px'});const scan=()=>document.querySelectorAll('[data-bg]').forEach(d=>{if(d.dataset.bg)io.observe(d);else d.removeAttribute('data-bg')});new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan()})();</script>
</body></html>
